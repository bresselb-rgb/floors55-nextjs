<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore DB Terminal | Floors 55</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#c5a059', terminal: '#0f172a' } } } }
    </script>
    <link rel="icon" type="image/svg+xml" href="images/f55-favicon.svg">
</head>
<body class="bg-terminal text-gray-300 font-mono h-screen flex flex-col overflow-hidden selection:bg-gold selection:text-black">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-terminal px-4 transition-opacity duration-500">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-8 text-center">
            <h1 class="text-2xl font-black text-white mb-2">RAW DATABASE <span class="text-gold">ACCESS</span></h1>
            <p class="text-gray-500 mb-6 font-bold uppercase text-[10px] tracking-widest">Authorized Admins Only</p>
            <form id="login-form" class="space-y-4 text-left" onsubmit="window.loginDB(event)">
                <input type="email" id="login-email" required placeholder="Admin Email" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg outline-none focus:border-gold text-sm text-white">
                <input type="password" id="login-password" required placeholder="Password" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg outline-none focus:border-gold text-sm text-white">
                <button type="submit" class="w-full bg-gold text-black font-black py-3 rounded-lg hover:bg-white transition uppercase text-xs tracking-widest mt-2">Initialize Connection</button>
                <p id="login-error" class="text-red-500 text-xs mt-4 font-bold hidden text-center"></p>
            </form>
            <div class="mt-6 pt-6 border-t border-gray-800">
                <a href="admin.html" class="text-[10px] text-gray-500 hover:text-white uppercase tracking-widest font-bold">← Return to Admin Console</a>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- HEADER -->
        <header class="bg-gray-900 border-b border-gray-800 h-14 flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h1 class="text-sm font-black text-white tracking-widest uppercase">F55<span class="text-gold">_DB_TERMINAL</span></h1>
                </div>
                <span class="text-[10px] text-gray-500 border-l border-gray-700 pl-4 py-1 uppercase tracking-widest">Env: Production</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="admin.html" class="text-[10px] bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded transition uppercase tracking-widest font-bold">Admin UI</a>
                <button onclick="window.logoutDB()" class="text-[10px] text-red-400 hover:text-red-300 uppercase tracking-widest font-bold">Disconnect</button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- SIDEBAR: COLLECTIONS -->
            <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
                <div class="p-4 border-b border-gray-800">
                    <h2 class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Collections</h2>
                </div>
                <div class="flex-1 overflow-y-auto py-2" id="collection-list">
                    <!-- Populated by JS -->
                </div>
            </aside>

            <!-- MIDDLE: DOCUMENTS LIST -->
            <div class="w-80 bg-terminal border-r border-gray-800 flex flex-col shrink-0">
                <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50">
                    <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest" id="current-collection-label">Documents</h2>
                    <button onclick="window.createNewDoc()" class="text-[18px] text-gold hover:text-white leading-none outline-none">+</button>
                </div>
                <div class="p-3 border-b border-gray-800">
                    <input type="text" id="doc-search" placeholder="Search IDs..." oninput="window.filterDocs()" class="w-full bg-gray-900 border border-gray-700 text-xs rounded px-3 py-2 outline-none focus:border-gold text-gray-300">
                </div>
                <div class="flex-1 overflow-y-auto" id="document-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- RIGHT: JSON EDITOR -->
            <main class="flex-1 bg-terminal flex flex-col relative">
                <div id="editor-header" class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 h-14 shrink-0">
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500 font-bold" id="editor-path">Select a document to edit</span>
                        <span id="editor-status" class="text-[9px] uppercase tracking-widest font-black text-gold hidden px-2 py-0.5 bg-gold/10 rounded">Modified</span>
                    </div>
                    <div class="flex gap-2" id="editor-actions" style="display: none;">
                        <button onclick="window.deleteCurrentDoc()" class="text-[10px] bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white px-4 py-1.5 rounded transition uppercase tracking-widest font-bold">Delete</button>
                        <button onclick="window.saveCurrentDoc()" id="save-btn" class="text-[10px] bg-gold text-black hover:bg-white px-6 py-1.5 rounded transition uppercase tracking-widest font-black">Save (Ctrl+S)</button>
                    </div>
                </div>
                
                <div class="flex-1 relative">
                    <textarea id="json-editor" spellcheck="false" class="absolute inset-0 w-full h-full bg-transparent text-gray-300 p-6 font-mono text-sm leading-relaxed outline-none resize-none disabled:opacity-50" disabled placeholder="{&#10;  Select a document to view its raw JSON...&#10;}"></textarea>
                </div>
            </main>
        </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-6 py-3 rounded shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 font-sans">
        <p class="font-bold text-xs tracking-wide" id="toast-message">Success</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCSO1glwpfcl6zMsDsxalO1_zTW89qiTqI", 
            authDomain: "floors-55.firebaseapp.com", 
            projectId: "floors-55", 
            storageBucket: "floors-55.firebasestorage.app", 
            messagingSenderId: "390652727558", 
            appId: "1:390652727558:web:c5c030bb5f75a66c428e87" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // HARDCODED PATH FOR LIVE DATABASE
        const appId = 'floors55-admin';

        const COLLECTIONS = [
            { id: 'pricing', label: 'Pricing Matrix' },
            { id: 'users', label: 'Pro Accounts' },
            { id: 'client_boards', label: 'Client Presentations' },
            { id: 'wholesale_requests', label: 'Trade Applications' },
            { id: 'quote_requests', label: 'Estimates' },
            { id: 'sample_requests', label: 'Sample Orders' },
            { id: 'general_inquiries', label: 'Inbox Messages' },
            { id: 'staff', label: 'Staff Directory' },
            { id: 'settings', label: 'System Config' }
        ];

        let activeCollection = 'pricing';
        let activeDocId = null;
        let documentsCache = [];
        let currentUnsub = null;
        let isCreatingNew = false;

        // AUTHENTICATION LOGIC
        onAuthStateChanged(auth, async (user) => {
            if (user && !user.isAnonymous) {
                // Verify they are staff before letting them see DB
                const staffDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', user.uid));
                if (!staffDoc.exists() && (await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'staff'))).empty) {
                     await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', user.uid), { email: user.email, role: 'admin', name: 'Master Admin', hasConsoleAccess: true });
                } else if (!staffDoc.exists()) {
                     await signOut(auth);
                     document.getElementById('login-error').innerText = "Terminal Access Denied.";
                     document.getElementById('login-error').classList.remove('hidden');
                     return;
                }

                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                renderCollections();
                loadCollection(activeCollection);
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        window.loginDB = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Connecting...";
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch (err) {
                document.getElementById('login-error').innerText = "Invalid connection credentials.";
                document.getElementById('login-error').classList.remove('hidden');
                btn.innerText = "Initialize Connection";
            }
        };

        window.logoutDB = async () => {
            await signOut(auth);
            window.location.reload();
        };

        // UI RENDERERS
        function renderCollections() {
            const container = document.getElementById('collection-list');
            container.innerHTML = '';
            
            COLLECTIONS.forEach(col => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-6 py-3 text-xs font-bold transition-colors outline-none flex justify-between items-center ${activeCollection === col.id ? 'bg-gray-800 text-gold border-r-2 border-gold' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'}`;
                btn.innerHTML = `<span>${col.id}</span>`;
                btn.onclick = () => loadCollection(col.id);
                container.appendChild(btn);
            });
        }

        function loadCollection(colId) {
            activeCollection = colId;
            activeDocId = null;
            renderCollections();
            
            document.getElementById('current-collection-label').innerText = `/${colId}`;
            document.getElementById('editor-path').innerText = `Select a document from /${colId}`;
            document.getElementById('editor-actions').style.display = 'none';
            document.getElementById('editor-status').classList.add('hidden');
            
            const editor = document.getElementById('json-editor');
            editor.value = '';
            editor.disabled = true;

            if (currentUnsub) currentUnsub();

            currentUnsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', colId), (snap) => {
                documentsCache = [];
                snap.forEach(d => {
                    documentsCache.push({ id: d.id, data: d.data() });
                });
                
                // Sort by ID alphabetically
                documentsCache.sort((a,b) => a.id.localeCompare(b.id));
                window.filterDocs();
                
                // Update active doc if it was updated remotely
                if (activeDocId && !isCreatingNew) {
                    const updated = documentsCache.find(d => d.id === activeDocId);
                    if (updated && !document.getElementById('editor-status').classList.contains('!block')) {
                        editor.value = JSON.stringify(updated.data, null, 2);
                    }
                }
            }, (error) => {
                console.error("DB Read Error:", error);
            });
        }

        window.filterDocs = () => {
            const term = document.getElementById('doc-search').value.toLowerCase();
            const filtered = documentsCache.filter(d => d.id.toLowerCase().includes(term));
            
            const container = document.getElementById('document-list');
            container.innerHTML = '';
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="p-4 text-xs text-gray-600 italic">No documents found.</div>';
                return;
            }

            filtered.forEach(doc => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 text-[11px] border-b border-gray-800 transition-colors outline-none truncate font-bold ${activeDocId === doc.id ? 'bg-gold/10 text-gold' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`;
                btn.innerText = doc.id;
                btn.onclick = () => selectDoc(doc.id, doc.data);
                container.appendChild(btn);
            });
        };

        function selectDoc(docId, data) {
            if (document.getElementById('editor-status').classList.contains('!block')) {
                if(!confirm("You have unsaved changes. Discard them?")) return;
            }

            activeDocId = docId;
            isCreatingNew = false;
            window.filterDocs();
            
            document.getElementById('editor-path').innerHTML = `<span class="text-gray-600">/${activeCollection}/</span><span class="text-white">${docId}</span>`;
            document.getElementById('editor-actions').style.display = 'flex';
            document.getElementById('editor-status').classList.remove('!block');
            document.getElementById('editor-status').classList.add('hidden');
            
            const editor = document.getElementById('json-editor');
            editor.disabled = false;
            editor.value = JSON.stringify(data, null, 2);
        }

        window.createNewDoc = () => {
            if (document.getElementById('editor-status').classList.contains('!block')) {
                if(!confirm("You have unsaved changes. Discard them?")) return;
            }

            const newId = prompt("Enter a unique Document ID:\n(Leave blank to auto-generate)");
            if (newId === null) return; // cancelled

            activeDocId = newId.trim() || `doc_${Date.now()}`;
            isCreatingNew = true;
            window.filterDocs();

            document.getElementById('editor-path').innerHTML = `<span class="text-gray-600">/${activeCollection}/</span><span class="text-gold">${activeDocId} (New)</span>`;
            document.getElementById('editor-actions').style.display = 'flex';
            document.getElementById('editor-status').classList.remove('hidden');
            document.getElementById('editor-status').classList.add('!block');
            
            const editor = document.getElementById('json-editor');
            editor.disabled = false;
            editor.value = "{\n  \n}";
            editor.focus();
        };

        // Editor Change Detection
        document.getElementById('json-editor').addEventListener('input', () => {
            if (activeDocId) {
                document.getElementById('editor-status').classList.remove('hidden');
                document.getElementById('editor-status').classList.add('!block');
            }
        });

        // CTRL+S to save
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (activeDocId) window.saveCurrentDoc();
            }
        });

        window.saveCurrentDoc = async () => {
            const rawJson = document.getElementById('json-editor').value;
            let parsedData;
            
            try {
                parsedData = JSON.parse(rawJson);
            } catch (err) {
                alert(`Invalid JSON format!\n\n${err.message}`);
                return;
            }

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.innerText = "SAVING...";

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', activeCollection, activeDocId), parsedData);
                document.getElementById('editor-status').classList.remove('!block');
                document.getElementById('editor-status').classList.add('hidden');
                isCreatingNew = false;
                showToast(`Saved ${activeDocId}`);
                document.getElementById('editor-path').innerHTML = `<span class="text-gray-600">/${activeCollection}/</span><span class="text-white">${activeDocId}</span>`;
            } catch (err) {
                console.error(err);
                alert(`Database Error:\n${err.message}`);
            } finally {
                btn.innerText = originalText;
            }
        };

        window.deleteCurrentDoc = async () => {
            if (!activeDocId) return;
            
            if (confirm(`CRITICAL WARNING:\n\nAre you absolutely sure you want to permanently delete '${activeDocId}' from /${activeCollection}?\n\nThis cannot be undone.`)) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', activeCollection, activeDocId));
                    showToast(`Deleted ${activeDocId}`);
                    activeDocId = null;
                    isCreatingNew = false;
                    document.getElementById('editor-path').innerText = `Select a document from /${activeCollection}`;
                    document.getElementById('editor-actions').style.display = 'none';
                    document.getElementById('json-editor').value = '';
                    document.getElementById('json-editor').disabled = true;
                    document.getElementById('editor-status').classList.remove('!block');
                    document.getElementById('editor-status').classList.add('hidden');
                } catch (err) {
                    alert(`Delete Error:\n${err.message}`);
                }
            }
        };

        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            document.getElementById('toast-message').innerText = msg; 
            t.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none'); 
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 3000); 
        }

    </script>
</body>
</html>
